<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Syne:wght@600;700;800&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				const stored = localStorage.getItem('theme');
				const dark =
					stored === 'dark' ||
					(stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			})();
		</script>
		<style>
			#app-preload {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: #f4f6f8;
				color: #12161c;
				transition:
					opacity 0.22s ease,
					visibility 0.22s ease;
			}
			html.dark #app-preload {
				background: #0e1116;
				color: #eef1f4;
			}
			#app-preload[data-hide='true'] {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			#app-preload .mark {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1rem;
			}
			#app-preload .badge {
				display: grid;
				place-items: center;
				width: 2.75rem;
				height: 2.75rem;
				border-radius: 0.2rem;
				background: #d0122d;
				color: #fff;
				font: 700 0.7rem/1 Syne, ui-sans-serif, system-ui, sans-serif;
				letter-spacing: -0.02em;
			}
			#app-preload .spin {
				width: 1.35rem;
				height: 1.35rem;
				border-radius: 999px;
				border: 2px solid color-mix(in srgb, currentColor 18%, transparent);
				border-top-color: #0a8fa8;
				animation: app-spin 0.7s linear infinite;
			}
			#app-preload .label {
				font: 500 0.8rem/1.2 'Atkinson Hyperlegible', ui-sans-serif, system-ui, sans-serif;
				opacity: 0.55;
			}
			@keyframes app-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#app-preload .spin {
					animation: none;
					border-top-color: color-mix(in srgb, currentColor 40%, transparent);
				}
				#app-preload {
					transition: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app-preload" role="status" aria-live="polite" aria-label="Loading">
			<div class="mark">
				<div class="badge">PDF</div>
				<div class="spin" aria-hidden="true"></div>
				<span class="label">Loading WeLovePDF…</span>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
